<!doctype html>
<html>
	<head>
		<meta charset="utf-8">
		<title>Fixture</title>
		<script>
			const {ipcRenderer} = require('electron');

			function init() {
				const enableButton = document.getElementById('enable');
				const disableButton = document.getElementById('disable');

				const toggle = isEnabled => {
					enableButton.disabled = isEnabled;
					disableButton.disabled = !isEnabled;
					ipcRenderer.send('toggle', isEnabled);
				};

				enableButton.addEventListener('click', () => {
					toggle(true);
				});

				disableButton.addEventListener('click', () => {
					toggle(false);
				});

				toggle(true);
			}

			window.addEventListener('load', init);
		</script>
	</head>
	<body>
		<h1>Fixture</h1>
		<br>
		<button id="disable" disabled>Disable</button>
		<button id="enable">Enable</button>
		<br>
		<br>
		<textarea></textarea>
		<br>
		<input>
		<br>
		<br>
		<img src="fixture.jpg">
		<br>
		<div contenteditable="true"><strong>Editable text</strong></div>
		<br>
		<a href="https://github.com">Link</a>
		<br>
		<br>
		<b>Copy <span style="color: hotPink">rich</span> text</b>
	</body>
</html>
